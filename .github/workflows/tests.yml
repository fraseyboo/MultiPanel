name: tests

on:
  push:
  pull_request:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        vtk: ["latest"]
        include:
          # The oldest supported VTK and the one the reference screenshots
          # were made with.
          - python-version: "3.12"
            vtk: "9.4.2"
          - python-version: "3.12"
            vtk: "9.5.2"
    name: linux (python ${{ matrix.python-version }}, vtk ${{ matrix.vtk }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - if: matrix.vtk != 'latest'
        run: python -m pip install "vtk==${{ matrix.vtk }}"
      - run: python -c "import vtk; print('VTK', vtk.vtkVersion.GetVTKVersion())"
      - run: xvfb-run -a python -m pytest -q

  test-macos:
    runs-on: macos-latest
    # Temporarily non-blocking: the hosted macOS runners fail intermittently
    # (the same commit both passes and fails). Remove once they are stable.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    name: macos (python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -c "import vtk; print('VTK', vtk.vtkVersion.GetVTKVersion())"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
